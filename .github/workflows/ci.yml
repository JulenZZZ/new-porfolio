name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build, lint, test, SEO gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run export-routes
      - run: npx tsc --noEmit -p tsconfig.app.json
      - run: npx tsc --noEmit -p tsconfig.spec.json
      - run: npm run lint
      - uses: browser-actions/setup-chrome@v1
      # karma-chrome-launcher discovers google-chrome from PATH.
      - run: npx ng test --watch=false --browsers=ChromeHeadlessNoSandbox
      - run: npm run build
      - run: node scripts/prerender-check.mjs
